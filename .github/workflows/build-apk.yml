name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk WidgetNotes.apk

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|Could not resolve|> " build.log | grep -v "^> Task" | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: WidgetNotes-apk
          path: WidgetNotes.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-notes-build-${{ github.run_number }}
          name: Widget Notes (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: WidgetNotes.apk
