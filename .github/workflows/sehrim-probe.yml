name: Sehrim probe
on:
  push:
    branches: [sehrim-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Duty
        run: python3 tools/gen_duty.py out 2>&1 | tee out-duty.log
      - name: Static
        run: python3 tools/gen_static.py out 2>&1 | tee out-static.log
      - name: Extra
        run: curl -sSL -m 60 -A "Mozilla/5.0" -o out/ieo-api.js https://www.istanbuleczaciodasi.org.tr/nobetci-eczane/yeni/js/api.js || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p out; mv out-*.log out/ || true
          git add out && git commit -qm "probe results" && git push
