name: Şehrim data

# Saatlik: nöbetçi eczane yedeği. Haftalık: OpenStreetMap'ten eczane + hat verisi.
# Çıktılar tek commit'lik "sehrim-data" dalına yazılır (geçmiş birikmez).
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "41 2 * * 1"
  push:
    branches: [main]
    paths:
      - "sehrim/tools/**"
      - ".github/workflows/sehrim-data.yml"
  workflow_dispatch:
    inputs:
      static:
        description: "Hat ve eczane verisini de yeniden üret"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sehrim-data
  # Kod değişince (push) eski çalışmayı iptal et; zamanlanmış çalışmalar sıraya girsin.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Get current data
        run: |
          mkdir -p data
          if git fetch --depth 1 origin sehrim-data; then
            git archive FETCH_HEAD | tar -x -C data
          fi
          ls -la data

      - name: On-duty pharmacies
        run: python3 sehrim/tools/gen_duty.py data

      - name: Publish duty data
        run: bash sehrim/tools/publish.sh "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" "duty-*.json"

      - name: Transit routes + pharmacies (OpenStreetMap)
        id: static
        if: >-
          github.event.schedule == '41 2 * * 1' ||
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.static) ||
          hashFiles('data/static-istanbul.json') == '' ||
          hashFiles('data/static-ankara.json') == '' ||
          hashFiles('data/static-eskisehir.json') == ''
        run: python3 sehrim/tools/gen_static.py data


      - name: Publish OSM data
        if: always() && steps.static.outcome != 'skipped'
        run: bash sehrim/tools/publish.sh "${{ secrets.GITHUB_TOKEN }}" "${{ github.repository }}" "static-*.json"
