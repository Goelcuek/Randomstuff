name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk WidgetNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WidgetNotes-apk
          path: WidgetNotes.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-notes-build-${{ github.run_number }}
          name: Widget Notes (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: WidgetNotes.apk
