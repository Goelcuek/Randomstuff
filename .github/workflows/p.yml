name: Sehrim pages check
on:
  push:
    branches: [sehrim-probe2]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          for i in $(seq 1 16); do
            c=$(curl -s -o out/page.html -w "%{http_code}" -m 20 https://goelcuek.github.io/Randomstuff/sehrim/)
            echo "$(date -u +%T) $c" >> out/log.txt
            [ "$c" = "200" ] && break; sleep 20
          done
          curl -s -o /dev/null -w "root %{http_code}\n" https://goelcuek.github.io/Randomstuff/ >> out/log.txt
          curl -s -o /dev/null -w "app.js %{http_code}\n" https://goelcuek.github.io/Randomstuff/sehrim/app.js >> out/log.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out && git commit -qm "probe results" && git push origin HEAD:sehrim-probe2
