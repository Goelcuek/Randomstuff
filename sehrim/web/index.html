<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Şehrim</title>
<meta name="description" content="İstanbul, Ankara ve Eskişehir için şu an açık ve nöbetçi eczaneler, acil servisler, kesintiler, depremler ve toplu taşıma hatları.">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A26" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#" aria-label="Şehrim ana sayfa">Şehrim</a>
    <div class="cities" role="radiogroup" aria-label="Şehir">
      <button role="radio" data-city="istanbul">İstanbul</button>
      <button role="radio" data-city="ankara">Ankara</button>
      <button role="radio" data-city="eskisehir">Eskişehir</button>
    </div>
    <button class="icon-btn" id="locate" title="Konumumu kullan" aria-label="Konumumu kullan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" fill="none"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" aria-label="Bölümler">
  <a href="#eczane" data-tab="eczane" class="tab t-ecz"><span class="sign">E</span><span>Eczane</span></a>
  <a href="#hastane" data-tab="hastane" class="tab t-hos"><span class="sign">H</span><span>Hastane</span></a>
  <a href="#ulasim" data-tab="ulasim" class="tab t-tra"><span class="sign">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 20.5l1.5-3M15.5 20.5l-1.5-3"/></svg></span><span>Ulaşım</span></a>
  <a href="#kesinti" data-tab="kesinti" class="tab t-out"><span class="sign">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 5 13.5h6L10 22l9-12.5h-6z"/></svg></span><span>Kesinti</span></a>
  <a href="#deprem" data-tab="deprem" class="tab t-qk"><span class="sign">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13h4l2.5-6 4 11 3-8 1.5 3H22"/></svg></span><span>Deprem</span></a>
  <a href="#harita" data-tab="harita" class="tab t-map"><span class="sign">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg></span><span>Harita</span></a>
</nav>

<main id="main" tabindex="-1">
  <section id="view-eczane" class="view" data-view="eczane"></section>
  <section id="view-hastane" class="view" data-view="hastane" hidden></section>
  <section id="view-ulasim" class="view" data-view="ulasim" hidden></section>
  <section id="view-kesinti" class="view" data-view="kesinti" hidden></section>
  <section id="view-deprem" class="view" data-view="deprem" hidden></section>
  <section id="view-harita" class="view view-map" data-view="harita" hidden>
    <div class="map-tools">
      <label class="check"><input type="checkbox" id="m-ph" checked> Açık eczaneler</label>
      <label class="check"><input type="checkbox" id="m-ho" checked> Acil servisler</label>
    </div>
    <div id="bigmap" class="map"></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <button class="icon-btn" id="sheet-close" aria-label="Kapat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="sheet-title"></h2>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
